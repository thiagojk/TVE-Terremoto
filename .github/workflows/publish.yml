name: Render and publish Quarto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libuv1-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Render report and run pipeline
        run: quarto render
      - name: Validate computed results and rendered links
        run: |
          Rscript tests/validate.R
          python3 tests/validate_inputs.py
          python3 tests/validate_html.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
